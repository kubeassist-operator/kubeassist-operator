---
# Leader election role — allows the controller to use coordination/leases
# for HA leader election within its own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubeassist-leader-election-role
  namespace: kubeassist-operator-system
  labels:
    app.kubernetes.io/name: kubeassist-operator
rules:
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [""]
  resources: [events]
  verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubeassist-leader-election-rolebinding
  namespace: kubeassist-operator-system
  labels:
    app.kubernetes.io/name: kubeassist-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubeassist-leader-election-role
subjects:
- kind: ServiceAccount
  name: kubeassist-operator-controller-manager
  namespace: kubeassist-operator-system
