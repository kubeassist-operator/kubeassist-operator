---
# ClusterRoleBinding — binds the manager ClusterRole to the operator SA
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeassist-manager-rolebinding
  labels:
    app.kubernetes.io/name: kubeassist-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: manager-role
subjects:
- kind: ServiceAccount
  name: kubeassist-operator-controller-manager
  namespace: kubeassist-operator-system
